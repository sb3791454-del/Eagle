name: AegisCloak Android Build & Packaging

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Project AegisCloak
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ./gradlew
          ls -la ./gradlew gradle/wrapper/

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload AegisCloak Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AegisCloak-Release-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Android IDE Project ZIP
        run: |
          echo "Packaging clean source project for Android Studio / IDE..."
          zip -r AegisCloak-Android-IDE-Project.zip . \
            -x ".git/*" \
            -x "*/build/*" \
            -x ".gradle/*" \
            -x ".idea/*" \
            -x "*.hprof" \
            -x ".build-outputs/*"
          ls -lh AegisCloak-Android-IDE-Project.zip

      - name: Upload Android IDE Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AegisCloak-Android-IDE-Project
          path: AegisCloak-Android-IDE-Project.zip
          if-no-files-found: error
          retention-days: 14
