name: AegisCloak Android Build & Packaging

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Project AegisCloak
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ./gradlew
          ls -la ./gradlew gradle/wrapper/

      - name: Restore Debug Keystore for Signing
        run: |
          echo "Restoring debug.keystore for APK signing verification..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64 successfully."
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback standard debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Ensure Dummy google-services.json Exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"000000000000","project_id":"aegis-cloak-dev","storage_bucket":"aegis-cloak-dev.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aistudio.aegiscloak.zkptmr"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildValidationOnly"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
            echo "Created dummy app/google-services.json for build validation."
          fi

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload AegisCloak Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AegisCloak-Release-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Android IDE Project ZIP
        run: |
          echo "Packaging clean source project for Android Studio / IDE..."
          zip -r AegisCloak-Android-IDE-Project.zip . \
            -x ".git/*" \
            -x "*/build/*" \
            -x ".gradle/*" \
            -x ".idea/*" \
            -x "*.hprof" \
            -x ".build-outputs/*"
          ls -lh AegisCloak-Android-IDE-Project.zip

      - name: Upload Android IDE Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AegisCloak-Android-IDE-Project
          path: AegisCloak-Android-IDE-Project.zip
          if-no-files-found: error
          retention-days: 14
